name: wasm tools
description: Installs wasm-bindgen-cli at the version in Cargo.lock.
runs:
  using: composite
  steps:
    - name: Read the wasm-bindgen version
      id: version
      shell: bash
      run: echo "wasm-bindgen=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: wasm-bindgen-${{ runner.os }}-${{ steps.version.outputs.wasm-bindgen }}
    # Other caches (rust-cache restores ~/.cargo/bin) may already have put a
    # wasm-bindgen there, possibly of another version: only install on a mismatch.
    - shell: bash
      env:
        WANT: ${{ steps.version.outputs.wasm-bindgen }}
      run: |
        have=$(wasm-bindgen --version 2>/dev/null | cut -d ' ' -f 2 || true)
        if [ "$have" = "$WANT" ]; then
          echo "wasm-bindgen $WANT already installed"
        else
          cargo install wasm-bindgen-cli --locked --force --version "$WANT"
        fi
