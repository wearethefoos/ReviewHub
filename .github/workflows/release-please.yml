name: Release Please

# On every push to main, release-please opens or updates a release pull request
# from the Conventional Commits since the last release: version bumps
# (version.txt, Cargo.toml, the plugin and extension manifests) and
# CHANGELOG.md. Merging that pull request tags the release and creates the
# GitHub release, and the binaries and extension are built and attached to it.
#
# Pull requests and commits made with the default GITHUB_TOKEN don't trigger
# CI. To get CI on the release pull request, add a RELEASE_PLEASE_TOKEN secret
# (a fine-grained token with Contents and Pull requests write access).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the version fields but not Cargo.lock or
  # package-lock.json; without them the --locked builds would fail.
  lockfiles:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Update the lockfiles to the release version
        run: scripts/bump-version.sh "$(cat version.txt)"
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Lockfiles already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update lockfiles for the release"
          git push

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit # the Chrome Web Store credentials
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
