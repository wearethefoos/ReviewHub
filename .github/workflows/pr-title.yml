name: PR title

# Pull requests are squash-merged, so their titles become the commits that
# release-please reads. Check that they follow Conventional Commits:
# feat: …, fix: …, docs: …, chore: …; `feat!:` for breaking changes.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
