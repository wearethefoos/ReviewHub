name: Release

# Builds the CLI for every platform the Claude plugin supports and the browser
# extension, and attaches them with SHA256SUMS to a GitHub release. The plugin
# downloads the binary of its own version from that release and verifies it
# against SHA256SUMS. See RELEASING.md.
#
# Then uploads the extension to the Chrome Web Store and submits it for review,
# once the CHROME_* secrets are set (RELEASING.md).
#
# Normally called by the Release Please workflow for the release it just
# created. Can also run by hand from the Actions tab (it then creates the tag
# and the release). It deliberately has no tag-push trigger: release-please
# pushes the tag with RELEASE_PLEASE_TOKEN, which would start a second,
# overlapping build of the same release.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to attach the builds to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match the versions in the repository)"
        required: true
      chrome-web-store:
        description: Upload the extension to the Chrome Web Store (turn off when rebuilding an existing release)
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || format('v{0}', inputs.version) }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the versions in the repository
        run: scripts/check-version.sh "${TAG#v}"

  cli:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p reviewhub --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/reviewhub${{ matrix.ext }}" "out/reviewhub-${{ matrix.target }}${{ matrix.ext }}"
          "out/reviewhub-${{ matrix.target }}${{ matrix.ext }}" --version
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  extension:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-tools
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run wasm && npm run build
        working-directory: extension
      - name: Package
        run: |
          mkdir -p out
          (cd extension/dist && zip -qr "../../out/reviewhub-extension-${TAG}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: out/*
          if-no-files-found: error

  publish:
    needs: [cli, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # release-please creates the release first; a manual run creates it here
        # (for a manual run, --target creates the tag on the built commit).
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi

  chrome-web-store:
    needs: publish
    if: github.event_name != 'workflow_dispatch' || inputs.chrome-web-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: out
      - name: Upload and submit for review
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ]; then
            echo "::notice::CHROME_EXTENSION_ID isn't set; not publishing to the Chrome Web Store (see RELEASING.md)."
            exit 0
          fi
          set -o pipefail
          if ! npx --yes chrome-webstore-upload-cli@4.0.2 --source "out/reviewhub-extension-${TAG}.zip" 2>&1 | tee upload.log; then
            if grep -q "in review" upload.log; then
              echo "::error::The previous version is still in review on the Chrome Web Store, so ${TAG} can't be uploaded yet. Once that review is done, re-run this job (Re-run failed jobs)."
            fi
            exit 1
          fi
