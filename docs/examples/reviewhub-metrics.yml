# Example workflow for a repository reviewed with ReviewHub: publishes test
# coverage for every pull request as a ReviewHub metrics report.
# Adjust the test command to produce coverage/lcov.info for your stack.
name: ReviewHub metrics

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run --coverage --coverage.reporter=lcov
      - name: Check out ReviewHub
        uses: actions/checkout@v4
        with:
          repository: wearethefoos/ReviewHub
          path: .reviewhub-cli
      - run: npm ci --prefix .reviewhub-cli
      - name: Publish metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --prefix .reviewhub-cli tsx .reviewhub-cli/cli/reviewhub.ts metrics \
            --lcov coverage/lcov.info --root "$PWD" --commit "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/metrics.json"
          npx --prefix .reviewhub-cli tsx .reviewhub-cli/cli/reviewhub.ts publish metrics "$RUNNER_TEMP/metrics.json" \
            --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
