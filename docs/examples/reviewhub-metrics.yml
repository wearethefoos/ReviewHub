# Example workflow for a repository reviewed with ReviewHub: publishes test
# coverage for every pull request as a ReviewHub metrics report.
# `reviewhub init` writes a fuller one for the test stacks it detects
# (.github/workflows/reviewhub-metrics.yml); use this when you don't use init.
# Adjust the test command to produce coverage/lcov.info for your stack.
# `reviewhub publish` reads the repository from GITHUB_REPOSITORY.
# Comments posted with the workflow token don't trigger other workflows, so
# this job refreshes the ReviewHub briefing itself.
name: ReviewHub metrics

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run --coverage --coverage.reporter=lcov
      - name: Install the ReviewHub CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wearethefoos/ReviewHub/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewhub metrics --lcov coverage/lcov.info --commit "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/metrics.json"
          reviewhub publish metrics "$RUNNER_TEMP/metrics.json" --pr "${{ github.event.pull_request.number }}"
          reviewhub briefing "$GITHUB_REPOSITORY#${{ github.event.pull_request.number }}" --publish
