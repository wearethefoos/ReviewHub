[package]
name = "reviewhub"
description = "Review agent-authored pull requests from the terminal, and publish ReviewHub reports."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "reviewhub"
path = "src/main.rs"

[dependencies]
reviewhub-core.workspace = true
anstream = "1"
anstyle = "1"
anyhow = "1"
sha2 = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
textwrap = { version = "0.16", features = ["terminal_size"] }
ureq = { version = "3.4", features = ["json", "platform-verifier"] }
