[package]
name = "reviewhub"
version = "0.1.0"
edition = "2024"
description = "Review agent-authored pull requests from the terminal, and publish ReviewHub reports."
repository = "https://github.com/wearethefoos/ReviewHub"
publish = false

[[bin]]
name = "reviewhub"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
jsonschema = { version = "0.58", default-features = false }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = { version = "0.16", features = ["terminal_size"] }
ureq = { version = "3.4", features = ["json", "platform-verifier"] }
